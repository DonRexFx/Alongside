<title>Alongside</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one phone-width column. Scrolling main area, tab bar docked at the bottom, sheets slide over. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#15233B; --muted:#5A687F; --line:#D7DFE7;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0;
  --warn:#9A4A12; --warn-soft:#FBE8D6; --warn-card:#F6D9BC;
  --alert:#B3261E; --alert-ink:#FFFFFF; --alert-soft:#FBE3E1;
  --ok:#1D7443; --ok-soft:#DDF2E5;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1626; --surface:#152238; --ink:#E7EDF6; --muted:#9BAABF; --line:#25344C;
  --accent:#4DC2CD; --accent-ink:#04252A; --accent-soft:#12373E;
  --warn:#F2A767; --warn-soft:#3A2614; --warn-card:#4A3016;
  --alert:#E5645A; --alert-ink:#2A0A08; --alert-soft:#3E1B19;
  --ok:#6FD39A; --ok-soft:#123322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1626; --surface:#152238; --ink:#E7EDF6; --muted:#9BAABF; --line:#25344C;
  --accent:#4DC2CD; --accent-ink:#04252A; --accent-soft:#12373E;
  --warn:#F2A767; --warn-soft:#3A2614; --warn-card:#4A3016;
  --alert:#E5645A; --alert-ink:#2A0A08; --alert-soft:#3E1B19;
  --ok:#6FD39A; --ok-soft:#123322; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);border-inline:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.wrap{display:flex;flex-direction:column;gap:16px;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.alert{background:var(--alert);border-color:var(--alert);color:var(--alert-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:700;text-align:left}
.back{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;align-self:flex-start;min-height:40px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel],input[type=time],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:110px;resize:vertical}
.check-row{display:flex;gap:10px;align-items:center;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.9rem;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.alert{background:var(--alert-soft);color:var(--alert)}
.tag.sample{background:var(--line);color:var(--muted)}
/* Today */
.next{border-radius:20px;padding:20px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:10px}
.next.lean{background:var(--warn-card);color:var(--ink)}
.next .big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.next .t{font-size:1.15rem;font-weight:700}
.next .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent;align-self:flex-start}
.next.lean .btn{background:var(--surface);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.task.done .check{background:var(--accent)}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0;display:flex;flex-direction:column}
.ttitle{font-weight:700;overflow-wrap:anywhere}
.tmeta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner.info{background:var(--accent-soft)}
/* Emergency card */
.ecard{border:2px solid var(--alert);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ecard header{background:var(--alert);color:var(--alert-ink);padding:10px 16px;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ecard dl{margin:0;padding:8px 16px 16px;display:grid;gap:12px}
.ecard dt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ecard dd{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-line;font-weight:500}
.ecard.big dd{font-size:1.2rem}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
/* Support */
.credits{display:flex;align-items:baseline;gap:8px}
.credits b{font-family:var(--display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:180px}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--muted);font-size:.85rem;text-align:center}
.stars{display:flex;gap:6px}
.stars button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.stars button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Tab bar */
.tabs{border-top:1px solid var(--line);background:var(--surface)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;min-height:58px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tabs button[aria-current=page]{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--alert)}
/* Sheets and toast */
.sheet{position:fixed;inset:0;background:rgba(8,14,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.full{position:fixed;inset:0;z-index:30;background:var(--surface);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:40;max-width:min(92vw,440px);text-align:center}
details.card summary{font-weight:700;cursor:pointer;min-height:28px}
details.card p{margin-top:8px;color:var(--muted)}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);width:100%}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
"use strict";
var KEY="alongside-v1";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,"0")};
var dkey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var todayK=function(){return dkey(new Date())};
var addDays=function(k,n){var p=k.split("-").map(Number);return dkey(new Date(p[0],p[1]-1,p[2]+n))};
var dayLabel=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})};
var toM=function(t){var p=t.split(":");return +p[0]*60+ +p[1]};

var TEMPLATES={
  school:{label:"School morning",note:"Wake up, breakfast, school run",items:[["06:30","Wake up and get dressed",1],["07:00","Breakfast and pack bags",1],["07:30","School run",1]]},
  homework:{label:"Homework hour",note:"Snack, then homework together",items:[["16:30","Snack and settle in",0],["17:00","Homework together",1]]},
  bedtime:{label:"Bedtime",note:"Bath, story, lights out",items:[["19:30","Bath and pyjamas",0],["20:00","Story or quiet talk",1],["20:30","Lights out",1]]}
};

/* ---------- data: private state per person, shared community in the database ---------- */
function blank(){return {onboarded:false,safetyOk:false,blockedIds:[],profile:{name:"",kids:[{name:"",age:""}],support:"",area:""},tasks:[],lean:{},
  emergency:{done:false,myPhone:"",allergies:"",meds:"",doctor:"",school:"",schoolPhone:"",pickup:"",contacts:[],plan:"",checkinOn:false,every:"24",lastCheckIn:0,buddies:[]}}}
function norm(o){var b=blank(),r={};Object.keys(b).forEach(function(k){r[k]=o&&o[k]!==undefined?o[k]:b[k]});
  r.profile=Object.assign(blank().profile,o&&o.profile||{});r.emergency=Object.assign(blank().emergency,o&&o.emergency||{});
  if(!Array.isArray(r.blockedIds))r.blockedIds=[];if(!Array.isArray(r.emergency.buddies))r.emergency.buddies=[];return r}
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}return blank()}
var S=blank();
var DB=null,MY=null,ADM=false,offline=false,stateReady=false,autoApproved=false,STATE_PATH="";
var C={members:{},posts:{},claims:{},msgs:{},checkins:{},approved:{},blocked:{},reports:{}};

/*LOGIC*/
function ageLine(kids){var n=kids.filter(function(k){return k.name.trim()||String(k.age).trim()}).length;if(!n)return "";
  var ages=kids.map(function(k){return parseInt(k.age,10)}).filter(function(a){return !isNaN(a)});
  var t=n+" child"+(n>1?"ren":"");if(ages.length)t+=", "+(ages.length>1?ages.slice(0,-1).join(", ")+" and "+ages[ages.length-1]:ages[0]);return t}
function stable(v){if(Array.isArray(v))return "["+v.map(stable).join(",")+"]";
  if(v&&typeof v==="object")return "{"+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+":"+stable(v[k])}).join(",")+"}";return JSON.stringify(v)}
function itemsOf(C,id){return (C.posts[id]||{}).items||[]}
function allItems(C){var o=[];Object.keys(C.posts).forEach(function(id){itemsOf(C,id).forEach(function(it){o.push(Object.assign({},it,{owner:id}))})});return o}
function approvedOf(C,id){return !!C.approved[id]&&!C.blocked[id]}
function balanceOf(C,id){var b=3;allItems(C).forEach(function(it){
  if(it.kind!=="request"||it.status!=="done"||!it.helperId||it.helperId===it.owner)return;
  if(it.helperId===id)b+=it.credits;if(it.owner===id)b-=it.credits});return b}
function ratingOf(C,id){var n=0,s=0;allItems(C).forEach(function(it){if(it.kind==="request"&&it.status==="done"&&it.helperId===id&&it.rating){n++;s+=it.rating}});return {n:n,avg:n?s/n:0}}
function claimersOf(C,owner,itemId){return Object.keys(C.claims).filter(function(h){return approvedOf(C,h)&&((C.claims[h]||{}).items||[]).some(function(c){return c.ownerId===owner&&c.id===itemId&&!c.withdrawn})})}
function claimOf(C,me,it){return ((C.claims[me]||{}).items||[]).find(function(c){return c.ownerId===it.owner&&c.id===it.id&&!c.withdrawn})}
function nearby(C,me,blocked){var all=allItems(C),ok=function(it){return it.owner!==me&&approvedOf(C,it.owner)&&blocked.indexOf(it.owner)<0};
  return {requests:all.filter(function(it){return it.kind==="request"&&it.status==="open"&&ok(it)&&(!it.toId||it.toId===me)}).sort(function(a,b){return (a.whenTs||0)-(b.whenTs||0)}),
          offers:all.filter(function(it){return it.kind==="offer"&&ok(it)})}}
function threadMsgs(C,it){var key=it.owner+"-"+it.id,m=[];[it.owner,it.helperId].forEach(function(p){if(!p)return;
  (((C.msgs[p]||{}).t||{})[key]||[]).forEach(function(x){m.push({from:p,at:x.at,text:x.text})})});return m.sort(function(a,b){return a.at-b.at})}
function overdue(C,me,now){return Object.keys(C.checkins).filter(function(id){var c=C.checkins[id];
  return id!==me&&c&&c.on&&c.lastAt&&(c.buddies||[]).indexOf(me)>=0&&now-c.lastAt>c.every*3600000})}
/*ENDLOGIC*/

var lastFail=0;
function fail(e){var n=Date.now();if(n-lastFail<4000)return;lastFail=n;toast(e&&e.code==="quota_exceeded"?"The shared database is full.":"Could not save. Check your connection.")}
var wq={};
function put(path,data){if(!DB)return;var q=wq[path]||(wq[path]={run:false,next:null});q.next=data;if(q.run)return;q.run=true;
  (async function(){while(q.next){var d=q.next;q.next=null;try{await DB.doc(path).set(d)}catch(e){fail(e)}}q.run=false})()}
var saveT=null,lastSaved="";
function save(){if(offline||!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}
  lastSaved=stable(S);clearTimeout(saveT);saveT=setTimeout(function(){saveT=null;put(STATE_PATH,JSON.parse(JSON.stringify(S)))},500)}
var pubT=null;
function pubMember(){if(offline||!DB||!S.onboarded)return;clearTimeout(pubT);pubT=setTimeout(function(){
  var m=C.members[MY]||{},d={name:S.profile.name.trim(),area:S.profile.area.trim(),kids:ageLine(S.profile.kids),support:S.profile.support,pledge:!!S.safetyOk,requestedAt:m.requestedAt||null};
  C.members[MY]=d;put("members/"+MY,d)},700)}
function myItems(){return itemsOf(C,MY).slice()}
function setItems(items){var d={items:items};C.posts[MY]=d;put("posts/"+MY,d)}
function myClaims(){return ((C.claims[MY]||{}).items||[]).slice()}
function setClaims(items){var d={items:items};C.claims[MY]=d;put("claims/"+MY,d)}
function setMsgs(t){var d={t:t};C.msgs[MY]=d;put("msgs/"+MY,d)}
function pubCheckin(){if(!DB)return;var e=S.emergency,d={on:!!e.checkinOn,every:+e.every||24,lastAt:e.lastCheckIn||0,buddies:e.buddies||[]};C.checkins[MY]=d;put("checkins/"+MY,d)}
function soft(){var a=document.activeElement;
  if(ui.sheet==="task"||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$("#app").contains(a))){ui.pending=true;return}render()}
function sub(name){DB.collection(name).onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});C[name]=m;
  if(name==="approved"&&ADM&&S.onboarded&&!m[MY]&&!autoApproved){autoApproved=true;DB.doc("approved/"+MY).set({at:Date.now(),by:MY}).catch(fail)}
  soft()},fail)}
function boot(){ui.boot=true;render();
  var bootT=setTimeout(function(){if(!stateReady){offline=true;S=loadLocal();ui.boot=false;render();toast("Could not reach the shared database. Working on this device only.")}},10000);
  (async function(){
    try{var cl=window.claude;if(cl&&cl.use){var d=await cl.use("db"),u=await cl.use("user");if(d&&u){MY=await u.id();ADM=await u.canEdit();if(MY)DB=d}}}catch(e){}
    if(!DB){clearTimeout(bootT);offline=true;S=loadLocal();ui.boot=false;render();return}
    STATE_PATH="data/users/"+MY+"/state";
    DB.doc(STATE_PATH).onSnapshot(function(snap){
      if(!stateReady){if(offline)return;stateReady=true;clearTimeout(bootT);
        if(snap.exists)S=norm(snap.data());else{var l=loadLocal();if(l.onboarded)S=l}
        ui.boot=false;lastSaved=stable(S);if(!snap.exists&&S.onboarded)save();
        ["members","posts","claims","msgs","checkins","approved","blocked"].forEach(sub);if(ADM)sub("reports");
        pubMember();render();return}
      if(snap.metadata.hasPendingWrites||saveT||(wq[STATE_PATH]&&wq[STATE_PATH].run))return;
      var d2=snap.data();if(!d2)return;var m=norm(d2);if(stable(m)!==lastSaved){S=m;lastSaved=stable(S);soft()}
    },fail)
  })()}

var ui={tab:"today",screen:null,sheet:null,tview:"today",weekDay:null,editId:null,ostep:0,estep:0,chatId:null,boot:false,ask:null,thread:null,pending:false,rate:5,reportWhy:"",seed:true,key:""};

function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
function kidsNamed(){return S.profile.kids.filter(function(k){return k.name.trim()})}
function setPath(p,v){var o=S,a=p.split(".");for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}

function seedTasks(which){var tk=todayK(),kids=kidsNamed(),kid=kids.length===1?kids[0].name:"";
  which.forEach(function(n){TEMPLATES[n].items.forEach(function(it){S.tasks.push({id:uid(),title:it[1],time:it[0],day:tk,kid:kid,essential:!!it[2],done:false})})})}
function loadSample(){S=blank();S.onboarded=true;S.profile={name:"Ada",kids:[{name:"Tobi",age:"7"},{name:"Zara",age:"3"}],support:"none",area:"Yaba, Lagos"};seedTasks(["school","homework","bedtime"]);
